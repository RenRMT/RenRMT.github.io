<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rijkshuisstijl Kleurenkiezer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        margin: 16px;
    }

    h1, h2, h3 {
        margin-top: 32px;
    }

    .subtitle {
        color: #535353;
        font-size: 14px;
        max-width: 640px;
        margin-top: -8px;
    }

    .palette-section {
        margin-bottom: 40px;
    }

    .palette-group {
        margin-bottom: 24px;
    }

    /* Responsive Grid */
    .palette {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 12px;
        width: 100%;
    }

    /* Color box */
    .color-box {
        --box-color: #000;
        background: var(--box-color);
        height: 110px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        position: relative;
        box-shadow: 0 2px 6px rgba(0,0,0,.15);
        cursor: pointer;
        transition: transform .2s;
        border: none;
        text-align: left;
    }

    .color-box:hover {
        transform: scale(1.05);
    }

    .caption {
        background: rgba(200,200,200,.30);
        font-size: 12px;
        padding: 4px;
        border-radius: 0 0 8px 8px;
        text-align: center;
    }

    .caption strong {
        display: block;
    }

    .copied {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(0,0,0,.75);
        color: #fff;
        padding: 3px 6px;
        border-radius: 4px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s;
    }

    .copied.visible {
        opacity: 1;
    }

    /* Controls */
    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0 16px 0;
        font-size: 14px;
    }

    .controls label {
        font-weight: 700;
        min-width: 80px;
    }

    .steps {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
        min-width: 100px;
    }

    .note {
        font-size: 12px;
        color: #696969;
        margin-top: -8px;
    }

    /* MOBILE TWEAKS */
    @media (max-width: 600px) {
        .palette {
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
        }

        .color-box {
            height: 90px;
        }

        .controls {
            flex-direction: column;
            align-items: flex-start;
        }

        .controls label {
            min-width: auto;
        }

        body {
            margin: 12px;
        }
    }
</style>
</head>

<body>
<h1>Rijkshuisstijl Kleurenkiezer</h1>
<p class="subtitle">Op basis van Rijksoverheid Rijkshuisstijl kleurenspecificatie (Lintblauw, de 17 communicatiekleuren, en de online grijstinten). Kleurverlopen gebruiken de officiële 6-staps schaal (100% / 75% / 60% / 45% / 30% / 15%).</p>
<div id="palette-root"></div>

<script>
// ============================================================
// OFFICIAL RIJKSHUISSTIJL COLOURS
// Source: rijkshuisstijl.nl — Kleuren
// ============================================================

// Lintblauw: the base/logo colour of the rijkshuisstijl
const LINTBLAUW = { name:'Lintblauw', value:'#154273' };

// The 17 official "communicatiekleuren"
const COMM_COLOURS = [
  { name:'Paars',       value:'#42145f' },
  { name:'Violet',      value:'#a90061' },
  { name:'Robijnrood',  value:'#ca005d' },
  { name:'Roze',        value:'#f092cd' },
  { name:'Rood',        value:'#d52b1e' },
  { name:'Oranje',      value:'#e17000' },
  { name:'Donkergeel',  value:'#ffb612' },
  { name:'Geel',        value:'#f9e11e' },
  { name:'Donkerbruin', value:'#673327' },
  { name:'Bruin',       value:'#94710a' },
  { name:'Donkergroen', value:'#275937' },
  { name:'Groen',       value:'#39870c' },
  { name:'Mosgroen',    value:'#777b00' },
  { name:'Mintgroen',   value:'#76d2b6' },
  { name:'Donkerblauw', value:'#01689b' },
  { name:'Hemelblauw',  value:'#007bc7' },
  { name:'Lichtblauw',  value:'#8fcae7' }
];

// Official online grey scale
const GRIJSTINTEN = [
  { name:'Grijs 1', value:'#f3f3f3' },
  { name:'Grijs 2', value:'#e6e6e6' },
  { name:'Grijs 3', value:'#cccccc' },
  { name:'Grijs 4', value:'#b4b4b4' },
  { name:'Grijs 5', value:'#999999' },
  { name:'Grijs 6', value:'#696969' },
  { name:'Grijs 7', value:'#535353' }
];

const BRAND = {
  CORP: [LINTBLAUW],
  NEUTRAL: GRIJSTINTEN
};

// Curated orderings of the 17 communicatiekleuren for data visualisation
const DATA_COLOURS = {
  contrasting: [
    'Robijnrood','Groen','Hemelblauw','Donkergeel','Paars','Mintgroen','Rood',
    'Lichtblauw','Bruin','Violet','Mosgroen','Donkerblauw','Geel','Donkerbruin',
    'Roze','Donkergroen','Oranje'
  ],
  rainbow: [
    'Rood','Donkerbruin','Oranje','Donkergeel','Bruin','Geel','Mosgroen','Groen',
    'Donkergroen','Mintgroen','Donkerblauw','Hemelblauw','Lichtblauw','Paars',
    'Violet','Roze','Robijnrood'
  ]
};

// ============================================================
// RAMP GENERATION
// Each ramp has 6 steps at 100%, 75%, 60%, 45%, 30%, 15% —
// matching the official "Tinten" chart on rijkshuisstijl.nl
// (see e.g. the Donkergroen tint page).
// Lintblauw has no published tint chart (it's used at full
// strength only), so it isn't included in the ramp selectors.
// ============================================================

const clamp = (n,min,max)=>Math.max(min,Math.min(max,n));

function hexToRgb(hex){
  return {
    r: parseInt(hex.slice(1,3),16),
    g: parseInt(hex.slice(3,5),16),
    b: parseInt(hex.slice(5,7),16)
  };
}

function rgbToHex(r,g,b){
  const h = n => clamp(Math.round(n),0,255).toString(16).padStart(2,'0');
  return `#${h(r)}${h(g)}${h(b)}`.toUpperCase();
}

function mix(hexFrom, hexTo, t){
  const a = hexToRgb(hexFrom), b = hexToRgb(hexTo);
  return rgbToHex(
    a.r + (b.r - a.r) * t,
    a.g + (b.g - a.g) * t,
    a.b + (b.b - a.b) * t
  );
}

const TINT_PERCENTS = [100, 75, 60, 45, 30, 15];

function buildRamp(name, baseHex){
  return TINT_PERCENTS.map(p => p === 100 ? baseHex.toUpperCase() : mix('#FFFFFF', baseHex, p / 100));
}

const RAMPS = {};
COMM_COLOURS.forEach(c => { RAMPS[c.name] = buildRamp(c.name, c.value); });

// Priority order for reducing steps: always keep 100% first,
// then spread remaining stops (15%, 60%, 30%, 75%, 45% last)
const PRIORITY = [0, 5, 2, 4, 1, 3];

function namesToSwatches(names){
  const all = [LINTBLAUW, ...COMM_COLOURS];
  return names.map(n => all.find(c => c.name === n));
}

// STATE
let singleColour='Hemelblauw', singleSteps=6;
let divergingLeft='Robijnrood', divergingRight='Groen', divergingSteps=7;

// UTILS
function contrastColor(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  const toLinear=c=>{const s=c/255; return s<=.03928?s/12.92:Math.pow((s+.055)/1.055,2.4);};
  const L=.2126*toLinear(r)+.7152*toLinear(g)+.0722*toLinear(b);
  return L>.179?'#000000':'#ffffff';
}

function maxOddSteps(){
  const minLen = Math.min(...Object.values(RAMPS).map(r=>r.length));
  return 2 * Math.min(minLen, PRIORITY.length) + 1;
}

// RAMP GENERATORS
function generateSingleRamp(name, steps){
  const arr = RAMPS[name];
  const n = clamp(steps,1,arr.length);
  return PRIORITY.slice(0,n).sort((a,b)=>a-b)
    .map((i,k)=>({name:`${name} ${k+1}`, value:arr[i]}));
}

function generateDivergingRamp(left,right,steps){
  let n = steps % 2 ? steps : steps - 1;
  n = clamp(n,3,maxOddSteps());

  const perSide = (n - 1) / 2;
  const idx = PRIORITY.slice(0,perSide).sort((a,b)=>a-b);

  const L = RAMPS[left], R = RAMPS[right];

  const leftRamp  = idx.map((i,k)=>({name:`${left} ${k+1}`, value:L[i]}));
  const rightRamp = idx.map((i,k)=>({name:`${right} ${k+1}`, value:R[i]})).reverse();

  return [...leftRamp, {name:'Grijs 1',value:'#F3F3F3'}, ...rightRamp];
}

// UI HELPERS
function createEl(tag, props={}, children=[]){
  const el=document.createElement(tag);
  Object.assign(el, props);
  children.forEach(c => el.appendChild(c));
  return el;
}

function createColorBox(c){
  const box=createEl('button',{className:'color-box'});
  box.style.setProperty('--box-color',c.value);

  const caption=createEl('div',{className:'caption'});
  caption.style.color=contrastColor(c.value);
  caption.innerHTML=`<strong>${c.name}</strong>${c.value}`;

  const toast=createEl('div',{className:'copied',textContent:'Copied!'});

  box.onclick=()=>{
    navigator.clipboard.writeText(c.value).then(()=>{
      toast.classList.add('visible');
      setTimeout(()=>toast.classList.remove('visible'),900);
    });
  };

  box.append(caption, toast);
  return box;
}

function renderPaletteGroup(parent, group){
  const article=createEl('article',{className:'palette-group'});
  const h3=createEl('h3',{textContent:group.name});
  const grid=createEl('div',{className:'palette'});

  group.colors.forEach(c => grid.appendChild(createColorBox(c)));
  article.append(h3, grid);
  parent.appendChild(article);
}

// CONTROLS
function createSelect(values, current, onChange){
  const sel=createEl('select',{className:'steps'});
  values.forEach(v=>{
    const opt=createEl('option',{value:v,textContent:v});
    if(v===current) opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=e=>onChange(e.target.value);
  return sel;
}

function renderSingleControls(section){
  const ctrl=createEl('div',{className:'controls'});

  const maxSingle = Math.min(...Object.values(RAMPS).map(r=>r.length));
  const singleStepOpts = [];
  for(let i=2; i<=maxSingle; i++) singleStepOpts.push(i);

  ctrl.append(
    createEl('label',{textContent:'Colour:'}),
    createSelect(Object.keys(RAMPS), singleColour, v=>{
      singleColour=v; render();
    }),
    createEl('label',{textContent:'Steps:'}),
    createSelect(singleStepOpts, singleSteps, v=>{
      singleSteps=parseInt(v); render();
    })
  );

  section.appendChild(ctrl);
}

function renderDivergingControls(section){
  const names = Object.keys(RAMPS);
  const oddSteps = [];
  for(let i=3; i<=maxOddSteps(); i+=2) oddSteps.push(i);

  const ctrl=createEl('div',{className:'controls'});
  ctrl.append(
    createEl('label',{textContent:'Colour 1:'}),
    createSelect(names, divergingLeft, v=>{divergingLeft=v; render();}),
    createEl('label',{textContent:'Colour 2:'}),
    createSelect(names, divergingRight, v=>{divergingRight=v; render();}),
    createEl('label',{textContent:'Steps:'}),
    createSelect(oddSteps, divergingSteps, v=>{
      divergingSteps=parseInt(v); render();
    })
  );

  section.appendChild(ctrl);
}

// SECTION RENDER
function buildSections(){
  return [
    {
      title:'Brand Colours',
      groups:[
        {name:'Lintblauw (logo colour)', colors:BRAND.CORP},
        {name:'Grijstinten online', colors:BRAND.NEUTRAL}
      ]
    },
    {
      title:'Communicatiekleuren',
      groups:[
        {name:'Contrasting order', colors:namesToSwatches(DATA_COLOURS.contrasting)}
      ]
    },
    {
      title:'Kleurverloop',
      controls:'single',
      groups:[{
        name:`${singleColour} ${singleSteps} steps`,
        colors:generateSingleRamp(singleColour,singleSteps)
      }]
    },
    {
      title:'Kleurverloop (2 kleuren)',
      controls:'div',
      groups:[{
        name:`${divergingLeft} – ${divergingRight}`,
        colors:generateDivergingRamp(divergingLeft,divergingRight,divergingSteps)
      }]
    }
  ];
}

function render(){
  const root=document.getElementById('palette-root');
  root.innerHTML='';

  buildSections().forEach(sec=>{
    const section=createEl('section',{className:'palette-section'});
    section.appendChild(createEl('h2',{textContent:sec.title}));

    if(sec.controls==='single') renderSingleControls(section);
    if(sec.controls==='div') renderDivergingControls(section);

    sec.groups.forEach(g => renderPaletteGroup(section,g));
    root.appendChild(section);
  });
}

render();
</script>

</body>
</html>
