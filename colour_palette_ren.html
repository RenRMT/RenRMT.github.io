<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Colour Palette</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        margin: 16px;
    }

    h1, h2, h3 {
        margin-top: 32px;
    }

    .palette-section {
        margin-bottom: 40px;
    }

    .palette-group {
        margin-bottom: 24px;
    }

    /* Responsive Grid */
    .palette {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 12px;
        width: 100%;
    }

    /* Color box */
    .color-box {
        --box-color: #000;
        background: var(--box-color);
        height: 110px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        position: relative;
        box-shadow: 0 2px 6px rgba(0,0,0,.15);
        cursor: pointer;
        transition: transform .2s;
        border: none;
        text-align: left;
    }

    .color-box:hover {
        transform: scale(1.05);
    }

    .caption {
        background: rgba(200,200,200,.30);
        font-size: 12px;
        padding: 4px;
        border-radius: 0 0 8px 8px;
        text-align: center;
    }

    .caption strong {
        display: block;
    }

    .copied {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(0,0,0,.75);
        color: #fff;
        padding: 3px 6px;
        border-radius: 4px;
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s;
    }

    .copied.visible {
        opacity: 1;
    }

    /* Controls */
    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0 16px 0;
        font-size: 14px;
    }

    .controls label {
        font-weight: 700;
        min-width: 80px;
    }

    .steps {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
        min-width: 100px;
    }

    /* MOBILE TWEAKS */
    @media (max-width: 600px) {
        .palette {
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
        }

        .color-box {
            height: 90px;
        }

        .controls {
            flex-direction: column;
            align-items: flex-start;
        }

        .controls label {
            min-width: auto;
        }

        body {
            margin: 12px;
        }
    }
</style>
</head>

<body>
<h1>Colour Palettes</h1>
<div id="palette-root"></div>

<script>
// GLOBAL COLOURS
const BRAND = {
  CORP: [
    { name:'Primary Teal', value:'#1C6758' }, { name:'Dark Teal', value:'#335252' }, { name:'Black', value:'#191919' }, { name:'Light Grey', value:'#F3F3F3' }
  ],
  NEUTRAL: [
    {name:'Platinum', value:'#ECECEC'}, {name:'Steel', value:'#B8B8B8'}
  ]
};
const DATA_COLOURS = {
  contrasting: [
    {name:'Teal',value:'#338877'}, {name:'Jasmine',value:'#FFDD77'}, {name:'Baltic',value:'#2B5B9B'}, {name:'Coral',value:'#FF9779'}, 
    {name:'Sky',value:'#88CCFF'}, {name:'Cherry',value:'#BC3C4C'}, {name:'Blush',value:'#FFBBDD'}, {name:'Violet',value:'#8833AA'}
  ],
  rainbow: [
    {name:'Violet',value:'#8833AA'}, {name:'Baltic',value:'#2B5B9B'}, {name:'Sky',value:'#88CCFF'}, {name:'Teal',value:'#338877'},
    {name:'Jasmine',value:'#FFDD77'}, {name:'Blush',value:'#FFBBDD'}, {name:'Coral',value:'#FF9779'}, {name:'Cherry',value:'#BC3C4C'}
  ]
};
const RAMPS = {
  Teal:["#ebf3f1","#d6e7e4","#adcfc9","#85b8ad","#5ca092","#338877","#296d5f","#1f5247","#143630","#0a1b18"],
  Jasmine:["#fffcf1","#fff8e4","#fff1c9","#ffebad","#ffe492","#FFDD77","#ccb15f","#998547","#665830","#332c18"],
  Baltic:["#eaeff5","#d5deeb","#aabdd7","#809dc3","#557caf","#2B5B9B","#22497c","#1a375d","#11243e","#09121f"],
  Coral:["#fff5f2","#ffeae4","#ffd5c9","#ffc1af","#ffac94","#FF9779","#cc7961","#995b49","#663c30","#331e18"],
  Sky:["#f3faff","#e7f5ff","#cfebff","#b8e0ff","#a0d6ff","#88CCFF","#6da3cc","#527a99","#365266","#1b2933"],
  Cherry:["#f8eced","#f2d8db","#e4b1b7","#d78a94","#c96370","#BC3C4C","#96303d","#71242e","#4b181e","#260c0f"],
  Blush:["#fff8fc","#fff1f8","#ffe4f1","#ffd6eb","#ffc9e4","#FFBBDD","#cc96b1","#997085","#664b58","#33252c"],
  Violet:["#f3ebf7","#e7d6ee","#cfaddd","#b885cc","#a05cbb","#8833AA","#6d2988","#521f66","#361444","#1b0a22"]
};

const PRIORITY = [5, 1, 3, 2, 4, 6, 7, 0, 8, 9];

// STATE
let singleColour='Teal', singleSteps=7;
let divergingLeft='Teal', divergingRight='Jasmine', divergingSteps=7;

// UTILS
const clamp = (n,min,max)=>Math.max(min,Math.min(max,n));

function contrastColor(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  const toLinear=c=>{const s=c/255; return s<=.03928?s/12.92:Math.pow((s+.055)/1.055,2.4);};
  const L=.2126*toLinear(r)+.7152*toLinear(g)+.0722*toLinear(b);
  return L>.179?'#000000':'#ffffff';
}

function maxOddSteps(){
  const minLen = Math.min(...Object.values(RAMPS).map(r=>r.length));
  return 2 * Math.min(minLen, PRIORITY.length) + 1;
}

// RAMP GENERATORS
function generateSingleRamp(name, steps){
  const arr = RAMPS[name];
  const n = clamp(steps,1,arr.length);
  return PRIORITY.slice(0,n).sort((a,b)=>a-b)
  .map(i=>({name:`${name} ${i+1}`, value:arr[i]}));
}

function generateDivergingRamp(left,right,steps){
  let n = steps % 2 ? steps : steps - 1;
  n = clamp(n,3,maxOddSteps());

  const perSide = (n - 1) / 2;
  const idx = PRIORITY.slice(0,perSide).sort((a,b)=>a-b);

  const L = RAMPS[left], R = RAMPS[right];

  const leftRamp  = idx.map(i=>({name:`${left} ${i+1}`, value:L[i]})).reverse();
  const rightRamp = idx.map(i=>({name:`${right} ${i+1}`, value:R[i]}));

  return [...leftRamp, {name:'Neutral',value:'#F9F9F9'}, ...rightRamp];
}

// UI HELPERS
function createEl(tag, props={}, children=[]){
  const el=document.createElement(tag);
  Object.assign(el, props);
  children.forEach(c => el.appendChild(c));
  return el;
}

function createColorBox(c){
  const box=createEl('button',{className:'color-box'});
  box.style.setProperty('--box-color',c.value);

  const caption=createEl('div',{className:'caption'});
  caption.style.color=contrastColor(c.value);
  caption.innerHTML=`<strong>${c.name}</strong>${c.value}`;

  const toast=createEl('div',{className:'copied',textContent:'Copied!'});

  box.onclick=()=>{
    navigator.clipboard.writeText(c.value).then(()=>{
      toast.classList.add('visible');
      setTimeout(()=>toast.classList.remove('visible'),900);
    });
  };

  box.append(caption, toast);
  return box;
}

function renderPaletteGroup(parent, group){
  const article=createEl('article',{className:'palette-group'});
  const h3=createEl('h3',{textContent:group.name});
  const grid=createEl('div',{className:'palette'});

  group.colors.forEach(c => grid.appendChild(createColorBox(c)));
  article.append(h3, grid);
  parent.appendChild(article);
}

// CONTROLS
function createSelect(values, current, onChange){
  const sel=createEl('select',{className:'steps'});
  values.forEach(v=>{
    const opt=createEl('option',{value:v,textContent:v});
    if(v===current) opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=e=>onChange(e.target.value);
  return sel;
}

function renderSingleControls(section){
  const ctrl=createEl('div',{className:'controls'});

  const maxSingle = Math.min(...Object.values(RAMPS).map(r=>r.length));
  const singleStepOpts = [];
  for(let i=2; i<=maxSingle; i++) singleStepOpts.push(i);

  ctrl.append(
    createEl('label',{textContent:'Colour:'}),
    createSelect(Object.keys(RAMPS), singleColour, v=>{
      singleColour=v; render();
    }),
    createEl('label',{textContent:'Steps:'}),
    createSelect(singleStepOpts, singleSteps, v=>{
      singleSteps=parseInt(v); render();
    })
  );

  section.appendChild(ctrl);
}

function renderDivergingControls(section){
  const names = Object.keys(RAMPS);
  const oddSteps = [];
  for(let i=3; i<=maxOddSteps(); i+=2) oddSteps.push(i);

  const ctrl=createEl('div',{className:'controls'});
  ctrl.append(
    createEl('label',{textContent:'Colour 1:'}),
    createSelect(names, divergingLeft, v=>{divergingLeft=v; render();}),
    createEl('label',{textContent:'Colour 2:'}),
    createSelect(names, divergingRight, v=>{divergingRight=v; render();}),
    createEl('label',{textContent:'Steps:'}),
    createSelect(oddSteps, divergingSteps, v=>{
      divergingSteps=parseInt(v); render();
    })
  );

  section.appendChild(ctrl);
}

// SECTION RENDER
function buildSections(){
  return [
    {
      title:'Brand Colours',
      groups:[
        {name:'Corporate brand',colors:BRAND.CORP},
        {name:'Neutral shades', colors:BRAND.NEUTRAL}
      ]
    },
    {
      title:'Data Colours',
      groups:[
        {name:'Contrasting order',colors:DATA_COLOURS.contrasting},
        {name:'Rainbow order',colors:DATA_COLOURS.rainbow}
      ]
    },
    {
      title:'Single Colour Ramps',
      controls:'single',
      groups:[{
        name:`${singleColour} ${singleSteps} steps`,
        colors:generateSingleRamp(singleColour,singleSteps)
      }]
    },
    {
      title:'Diverging Ramps',
      controls:'div',
      groups:[{
        name:`${divergingLeft} – ${divergingRight}`,
        colors:generateDivergingRamp(divergingLeft,divergingRight,divergingSteps)
      }]
    }
  ];
}

function render(){
  const root=document.getElementById('palette-root');
  root.innerHTML='';

  buildSections().forEach(sec=>{
    const section=createEl('section',{className:'palette-section'});
    section.appendChild(createEl('h2',{textContent:sec.title}));

    if(sec.controls==='single') renderSingleControls(section);
    if(sec.controls==='div') renderDivergingControls(section);

    sec.groups.forEach(g => renderPaletteGroup(section,g));
    root.appendChild(section);
  });
}

render();
</script>

</body>
</html>
